name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-compatibility:
    name: Windows CLI compatibility
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Validate dependency lock
        run: uv lock --check

      - name: Compile Python sources
        run: python -m compileall -q indextts cli_tests tests webui.py

      - name: Run dependency-free CLI tests
        run: python -m unittest discover -s cli_tests -p "test_*.py"

  lightweight-checks:
    name: Lightweight Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests (no GPU)
        run: uv run --extra test pytest -m "not gpu" -v
